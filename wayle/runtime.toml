[bar]
scale = 0.8999999761581421
inset-edge = 0.5
inset-ends = 0.5
padding-ends = 1.0
background-opacity = 0
rounding = "md"
button-variant = "basic"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "power",
    "media",
    "cava",
]
center = ["hyprland-workspaces"]
right = [
    "systray",
    "microphone",
    "volume",
    "ram",
    "battery",
    "bluetooth",
    "clock",
    "notifications",
]

[styling.palette]
bg = "#11111b"
surface = "#11111b"
elevated = "#1e1e2e"
fg = "#cdd6f4"
fg-muted = "#bac2de"
primary = "#b4befe"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#74c7ec"

[modules.battery]
format = "{{ percent }}0% probably, idk"

[modules.bluetooth]
label-show = false

[modules.cava]
direction = "mirror"
bar-width = 2
bar-gap = 5

[modules.hyprland-workspaces]
min-workspace-count = 4
monitor-specific = false
workspace-padding = 0.800000011920929
label-size = 0.8999999761581421
active-indicator = "underline"

[modules.media]
icon-show = false

[modules.network]
label-show = false

[modules.power]
right-click = "reboot"
left-click = "shutdown now"

[modules.ram]
format = "{{ used_gib }} GiB"

[wallpaper]
engine-enabled = false
